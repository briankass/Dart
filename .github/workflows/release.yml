name: Release

# Fully automatic: on every push to main, if the version in Cargo.toml has no
# release yet, build dart.exe, create the vX.Y.Z tag and publish the release.
# Running copies of Dart pick it up via their built-in updater.
# To ship a new version, just bump `version` in Cargo.toml and push.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "src/**"
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$ver is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$ver is new; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Checksum
        shell: bash
        run: |
          cp target/release/dart.exe dart.exe
          sha256sum dart.exe | cut -d' ' -f1 > dart.exe.sha256
          ls -l dart.exe

      - name: Tag and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Dart v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dart.exe
            dart.exe.sha256
          generate_release_notes: true
