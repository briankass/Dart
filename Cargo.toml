[package]
name = "dart"
version = "0.2.1"
edition = "2021"
description = "A tiny, instant Windows app launcher written in Rust"
repository = "https://github.com/briankass/Dart"

[dependencies]
nucleo-matcher = "0.3"
serde_json = "1"
sha2 = "0.10"
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
